services:
  - type: web
    name: kav-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-3.5-flash-lite"
      - key: TEXT_MODEL_FALLBACK
        value: "gemini-3.1-flash-lite"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts,gemini-3.1-flash-tts,gemini-3.8-flash-lite-tts,gemini-2.5-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"m\":\"2\",\"g\":\"\",\"x\":\"\"}]"
      - key: MAX_WORDS
        value: "100"
      - key: HISTORY_EXT
        value: "9"
      - key: EXTRA_INSTRUCTION
        value: ""
      - key: MEDIA_FILES
        value: "[]"
      - key: SONGS_EXT
        value: "8"
      - key: SONGS_PASS
        sync: false
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
